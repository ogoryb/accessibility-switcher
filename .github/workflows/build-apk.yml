name: Build Kivy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build APK inside Buildozer Docker
        run: |
          docker run --rm \
            --entrypoint bash \
            -v "$PWD":/home/user/hostcwd \
            kivy/buildozer:latest \
            /home/user/hostcwd/scripts/build.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-switcher-apk
          path: bin/*.apk
